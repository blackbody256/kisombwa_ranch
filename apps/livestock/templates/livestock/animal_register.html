{% extends 'livestock/base.html' %}

{% block title %}Register Animal{% endblock %}

{% block content %}
<h2><i class="bi bi-plus-circle"></i> Register New Animal</h2>
<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Register Animal
            </button>
            <a href="{% url 'livestock_home' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
