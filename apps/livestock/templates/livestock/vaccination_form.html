{% extends 'livestock/base.html' %}
{% block title %}Record Vaccination{% endblock %}
{% block content %}
<h2><i class="bi bi-shield-plus"></i> Record Vaccination</h2>
{% if animal %}<p>For animal: <strong>{{ animal.tag_id }}</strong></p>{% endif %}
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% if animal %}{% url 'animal_profile' animal.tag_id %}{% else %}{% url 'livestock_home' %}{% endif %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
